<div class="pysznepl-note" data-pysznepl-template="note-widget">
  <button
    type="button"
    class="pysznepl-note__toggle"
    aria-expanded="false"
    data-role="toggle"
  >
    <span class="pysznepl-note__indicator" data-role="indicator"></span>
    <span class="pysznepl-note__toggle-label" data-role="toggle-label"></span>
  </button>

  <div class="pysznepl-note__panel" hidden data-role="panel">
    <div class="pysznepl-note__title" data-role="title"></div>
    <textarea
      class="pysznepl-note__textarea"
      rows="4"
      placeholder="Wpisz swoją notatkę…"
      spellcheck="false"
      data-role="textarea"
    ></textarea>
    <div class="pysznepl-note__status" data-role="status"></div>
  </div>
</div>
